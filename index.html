<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Fumeni ERP</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="./logo.png"
  >

  <!-- iPhone / iPad -->
  <link
    rel="apple-touch-icon"
    href="./logo.png"
  >

  <!-- PWA -->
  <link
    rel="manifest"
    href="./manifest.json"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Fumeni ERP"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading {
      text-align: center;
      color: #475569;
      padding: 24px;
    }

    .loading img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="loading">
    <img
      src="./logo.png"
      alt="Fumeni ERP"
    >

    <div class="loading-text">
      Đang kết nối Fumeni ERP...
    </div>
  </div>

  <script>
    /*
     * GitHub Pages chỉ làm lớp Shell.
     * Dữ liệu/nghiệp vụ thực tế vẫn chạy ở Google Apps Script.
     */

    const GAS_URL = 'DÁN_LINK_WEB_APP_GAS_CỦA_BẠN_VÀO_ĐÂY';

    function openGAS() {
      if (!GAS_URL || GAS_URL.includes('DÁN_LINK')) {
        document.querySelector('.loading-text').textContent =
          'Chưa cấu hình URL Google Apps Script.';
        return;
      }

      window.location.replace(GAS_URL);
    }

    /*
     * Cho GitHub Pages load xong rồi mới chuyển sang GAS.
     */
    window.addEventListener('load', function () {
      setTimeout(openGAS, 150);
    });

    /*
     * Service Worker chỉ cache GitHub Pages shell,
     * không cache dữ liệu từ Google Apps Script.
     */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {
        scope: './'
      }).catch(function (error) {
        console.warn('Service Worker registration failed:', error);
      });
    }
  </script>

</body>
</html>
