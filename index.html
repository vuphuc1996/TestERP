<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NEXA">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
  <title>NEXA Workforce Suite</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">NEXA</a>
    <div class="d-flex align-items-center gap-2">
      <span id="identityBadge" class="small text-secondary"></span>
      <button class="btn btn-outline-primary btn-sm" id="btnBiometric">Passkey</button>
    </div>
  </div>
</nav>
<main class="container-fluid py-3">
  <div id="mobileNotice" class="alert alert-info d-none"></div>
  <div class="row g-3">
    <aside class="col-12 col-xl-2">
      <div id="moduleNav" class="list-group shadow-sm"></div>
    </aside>
    <section class="col-12 col-xl-10">
      <div id="app"></div>
    </section>
  </div>
</main>
<div id="loading" class="position-fixed top-0 start-0 w-100 h-100 d-none" style="background:rgba(255,255,255,.72);z-index:3000">
  <div class="d-flex justify-content-center align-items-center h-100">
    <div class="spinner-border text-primary"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
